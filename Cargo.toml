[package]
name = "rswfn"
version = "0.2.0"
edition = "2024"
authors = ["Shi Xiaofei"]
description = "A wavefunction analysis library and command-line tool for quantum chemistry"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/qmlCoder/rswfn"
homepage = "https://github.com/qmlCoder/rswfn"
documentation = "https://docs.rs/rswfn"
keywords = ["quantum-chemistry", "wavefunction", "chemistry", "dft", "molecular"]
categories = ["science", "mathematics", "command-line-utilities"]
# Only source and metadata belong on crates.io. Large sample data, native
# libraries and development scratch files stay out of the published package.
exclude = [
    "/moles",
    "/protos",
    "/docs",
    "/prompts",
    "/.cargo",
    "/.idea",
    "/.vscode",
    "/flamegraph.svg",
    "/rswfn-linux",
    "/test.png",
    "/test.py",
    "/test.txt",
    "/config.json",
    "/TODO.md",
    "/*.pdf",
    "/.env",
    "/.env.*",
    "/dist",
]


[lib]
name = "rswfn"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
ndarray = "0.16"
faer = "0.24.0"
regex = "1.11.1"                                         # 正则表达式库
rayon = "1.5.1"                                          # 并行计算库
mem_dbg = "0.3.0"
rand = "0.9.1"                                           # 随机数库
log = "0.4.28"                                           # 日志库
simplelog = "0.12.2"
clap = { version = "4.0", features = ["derive"] }        # 命令行工具库
memmap2 = "0.9.9"                                        # 内存映射库，将硬盘当成内存用
special = "0.11.4"
chrono = "0.4"
cached = "0.56.0"                                        # 函数级缓存库
serde = { version = "1", features = ["derive"] }         # 结果结构序列化
serde_json = "1"                                         # --json 输出
ratatui = "0.29"                                         # 全屏终端界面（TUI）
# rsint 0.1.2 起已可在 stable(含 Windows/MSVC)上编译, 不再需要 nightly.
rsint = "0.1.2"                                      # libcint 的 Rust 直译版（必选）
rsxcs = { version = "0.2", optional = true }             # libxc 7.1.2 子集的 Rust 实现
rsbse = { version = "0.12.1", optional = true }


# rsbse 依赖 native-tls, 在 Linux 上会落到 openssl-sys, 需要系统 libssl 开发包.
# 为了 `cargo install` 和 musl 发布构建都不依赖目标机器上的 OpenSSL, Linux 上改用
# vendored OpenSSL (从源码编译, 需要 perl + make + cc/musl-gcc).
[target.'cfg(target_os = "linux")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }


[profile.dev]
incremental = true

[profile.release]
lto = true
opt-level = 3
strip = true      # Ensures debug symbols are removed.
codegen-units = 1
# TUI 需要能捕获后台任务中的 panic（catch_unwind），因此不能使用 abort。
panic = "unwind"
# 不能同时开 debug：lib 与 bin 同名 `rswfn`，都会写 deps/rswfn.pdb，
# fat LTO 下曾导致 rustc 0xc0000005（STATUS_ACCESS_VIOLATION）；
# 而且 strip = true 本来就会剥掉调试信息。
# 需要性能剖析时请改为 debug = true + strip = false，并注意 PDB 同名问题。
debug = false

[features]
default = ["use-rsxcs", "use-rsbse"]
use-rsbse = ["dep:rsbse"]                # 使用rsbse(Basis Set Exchange)数据库获取基组
use-rsxcs = ["dep:rsxcs"]                     # 使用rsxcs(libxc 7.1.2 子集的 Rust 实现)
