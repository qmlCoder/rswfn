name: Mirror to OSS

# 手动把某个已发布的 GitHub Release 的资产镜像到阿里云 OSS：
#   oss://wmview/rswfn/v<version>/
# 用途：回填历史上没有镜像的版本，或自动镜像失败后重跑（重跑是幂等的，同名对象覆盖）。
#
# 需要仓库 secrets：OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET / OSS_ENDPOINT
# 可选：OSS_BUCKET（默认 wmview）、OSS_PREFIX（默认 rswfn）。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要镜像的 release tag（如 v0.1.3）；留空表示 latest release"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  mirror:
    name: mirror to OSS
    runs-on: ubuntu-latest
    env:
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG}"
          if [ -z "${tag}" ]; then
            tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          fi
          echo "MIRROR_TAG=${tag}" >> "${GITHUB_ENV}"
          echo "==> mirroring ${tag}"

      - name: Download release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${MIRROR_TAG}" --repo "${GITHUB_REPOSITORY}" --dir dist --clobber
          ls -l dist

      - name: Upload to Aliyun OSS
        shell: bash
        run: |
          set -euo pipefail
          # 手动触发时不静默跳过：缺凭据直接报错，免得以为传成功了
          : "${OSS_ACCESS_KEY_ID:?缺少 secret OSS_ACCESS_KEY_ID}"
          : "${OSS_ACCESS_KEY_SECRET:?缺少 secret OSS_ACCESS_KEY_SECRET}"
          : "${OSS_ENDPOINT:?缺少 secret OSS_ENDPOINT}"
          python3 -m pip install --quiet --disable-pip-version-check oss2
          # 只补版本目录：回填旧版本不应该把 latest.txt 退回旧版本，
          # 所以这里刻意不加 --installers / --latest。
          python3 scripts/upload_oss.py "${MIRROR_TAG}" dist
